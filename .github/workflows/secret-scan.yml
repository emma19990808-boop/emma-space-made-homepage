# APIキー・トークンの誤コミット検知（EMMA共通）
# GitHubのsecret scanningは私有リポだと有料のため、無料のgitleaksで代替する。
# 配置元テンプレート: 株式会社EMMA/開発ナレッジ/templates/ci.yml
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

# gitleaks-actionはPRのコミット一覧を読むため、明示的に権限を与える
# （既定のGITHUB_TOKENはcontents:readのみで403になる）
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
